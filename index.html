<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gym Plan</title>
<meta name="description" content="Trainingsplan mit Profilen, Kalender und Fortschritt – komplett offline">
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Gym Plan – dunkles Design mit Lime-Akzent (aus Version 1 übernommen und verfeinert) */
:root{
  --bg:#0B0C0E; --surface:#15171B; --surface-2:#1B1E23; --offset:#101216;
  --border:#262A31; --divider:#202329;
  --text:#EDEFEA; --muted:#8B9199; --faint:#5F656D;
  --lime:#C6F527; --lime-strong:#A8D80C; --lime-dim:rgba(198,245,39,.12); --lime-line:rgba(198,245,39,.35);
  --danger:#FF6B5E; --danger-dim:rgba(255,107,94,.12); --warn:#FFC145; --warn-dim:rgba(255,193,69,.12); --info:#7DB7FF;
  --on-lime:#10120A;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:19px; --text-xl:26px;
  --font-display:'Clash Display','Satoshi',system-ui,sans-serif;
  --font-body:'Satoshi','Segoe UI',system-ui,sans-serif;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --nav-h:66px; --maxw:560px;
  color-scheme:dark;
}
@media (min-width:760px){ :root{ --maxw:720px } }
@media (min-width:1100px){ :root{ --maxw:980px } }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
body{
  min-height:100dvh;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:var(--text-base);line-height:1.5;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;font-weight:600}
::selection{background:rgba(198,245,39,.3)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:6px}
button,.btn,input,select{transition:background .18s,border-color .18s,color .18s,transform .12s,opacity .18s}
[hidden]{display:none!important}

/* ---------- Kopfzeile ---------- */
header{
  position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);
  background:rgba(11,12,14,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--divider);
}
.head-in{max-width:var(--maxw);margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;flex:none}
.head-txt{min-width:0;flex:1}
.head-txt h1{font-size:var(--text-lg);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-txt p{font-size:var(--text-xs);color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;max-width:46%}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--on-lime);font-family:var(--font-display);font-weight:600;display:grid;place-items:center;flex:none}
.who span{font-size:var(--text-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:var(--maxw);margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}

/* ---------- Bausteine ---------- */
.view{display:none}
.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}*{transition:none!important}}
.sechead{padding:6px 2px 14px}
.sechead h2{font-size:var(--text-xl)}
.sechead p{font-size:var(--text-sm);color:var(--muted);margin-top:4px}
.sublabel{font-family:var(--font-display);color:var(--muted);font-size:var(--text-sm);font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:18px 2px 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;min-width:0}
.card h3{font-size:var(--text-base)}
.muted{color:var(--muted)}
.small{font-size:var(--text-sm)}
.xs{font-size:var(--text-xs)}
.lime{color:var(--lime)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{
  min-height:46px;padding:10px 18px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);
  font-weight:700;font-size:var(--text-sm);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;
}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{background:var(--danger-dim);border-color:rgba(255,107,94,.4);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:var(--text-xs)}
.btn:disabled{opacity:.35;cursor:default}
.iconbtn{width:40px;height:40px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:18px;height:18px}
.chip{font-size:var(--text-xs);font-weight:500;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip b{color:var(--text)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.pickchips{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:42px;padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-weight:700;font-size:var(--text-sm);color:var(--muted)}
.pickchips.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pickchips.week .pick{padding:8px 0;min-width:0}
.pick.on{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.optlist{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border)}
.opt b{display:block;font-size:var(--text-base)}
.opt span{display:block;font-size:var(--text-sm);color:var(--muted)}
.opt.on{border-color:var(--lime);background:var(--lime-dim)}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);margin-top:2px}
.opt.on .dot{border-color:var(--lime);background:radial-gradient(var(--lime) 45%,transparent 50%)}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:var(--text-sm);color:var(--muted);min-width:0}
.inp{
  width:100%;min-height:46px;background:var(--offset);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:0 14px;font-weight:700;font-size:var(--text-base);color:var(--text);
}
.inp:focus{border-color:var(--lime);outline:none}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:var(--text-sm);border:1px dashed var(--border);border-radius:var(--r-lg)}

/* ---------- Hinweisbanner ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--lime-line);border-radius:var(--r-lg);padding:14px;margin-bottom:14px}
.banner.warn{border-color:rgba(255,193,69,.4);background:linear-gradient(180deg,var(--warn-dim),var(--surface) 70%)}
.banner.info{border-color:rgba(125,183,255,.35)}
.banner .ico{flex:none;width:38px;height:38px;border-radius:11px;background:var(--lime-dim);display:grid;place-items:center;color:var(--lime)}
.banner.warn .ico{background:var(--warn-dim);color:var(--warn)}
.banner.info .ico{background:rgba(125,183,255,.12);color:var(--info)}
.banner .ico svg{width:20px;height:20px}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:block;font-size:var(--text-base)}
.banner .bt p{font-size:var(--text-sm);color:var(--muted);margin-top:2px}
.banner .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.banner .x{flex:none;color:var(--faint);font-size:18px;padding:2px 4px}

/* ---------- Training ---------- */
.daytabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:5px;overflow-x:auto;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytabs button{flex:1 0 auto;min-width:64px;padding:10px 12px;border-radius:calc(var(--r-md) - 4px);font-weight:700;font-size:var(--text-sm);color:var(--muted);white-space:nowrap;position:relative}
.daytabs button.on{background:var(--lime);color:var(--on-lime)}
.daytabs button.next:not(.on)::after{content:"";position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--lime)}
.day-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 2px 12px}
.day-meta h2{font-size:var(--text-xl);min-width:0}
.day-meta h2 small{display:block;font-family:var(--font-body);font-size:var(--text-sm);color:var(--muted);font-weight:500;margin-top:4px}
.day-meta .cnt{font-size:var(--text-sm);color:var(--muted);white-space:nowrap;text-align:right;flex:none}
.day-meta .cnt b{color:var(--lime);font-family:var(--font-display);font-size:var(--text-lg)}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:0 2px 14px}
.progress i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .3s}
.exlist{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){ .exlist{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start} }
.excard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;min-width:0}
.excard.complete{border-color:var(--lime-line)}
.excard.cardio{background:linear-gradient(180deg,var(--lime-dim),var(--surface) 60%);border-color:var(--lime-line)}
.excard.compact{padding:12px 14px}
.ex-head{display:flex;align-items:flex-start;gap:10px}
.ex-num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-family:var(--font-display);font-size:var(--text-sm);font-weight:600;display:grid;place-items:center}
.excard.complete .ex-num{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.ex-title{flex:1;min-width:0}
.ex-title h3{font-size:var(--text-base);overflow-wrap:anywhere}
.ex-title .chiprow{margin-top:8px}
.ex-tag{font-size:var(--text-xs);color:var(--warn);margin-top:6px}
.wpanel{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;background:var(--offset);border:1px solid var(--divider);border-radius:var(--r-md)}
.wpanel .wbig{font-family:var(--font-display);font-size:30px;font-weight:600;color:var(--lime);line-height:1;white-space:nowrap}
.wpanel .wbig small{font-size:var(--text-sm);color:var(--muted);font-family:var(--font-body);font-weight:500}
.wpanel .wsub{font-size:var(--text-xs);color:var(--muted);margin-top:5px;white-space:nowrap}
.wpanel .wctl{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.wctl button{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:20px;display:grid;place-items:center}
.wctl button:active{transform:scale(.92)}
.wctl .mval{min-width:56px;text-align:center;font-weight:700;font-size:var(--text-sm);line-height:1.15}
.wctl .mval small{display:block;font-size:10px;color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.setpill{flex:1 1 64px;max-width:120px;min-height:46px;padding:10px 8px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-weight:700;font-size:var(--text-sm);text-align:center}
.setpill.done{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.setpill:active{transform:scale(.95)}
.tip{margin-top:12px;font-size:var(--text-sm);color:var(--lime);font-weight:600;background:var(--lime-dim);border:1px solid var(--lime-line);border-radius:var(--r-sm);padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tip.warn{color:var(--warn);background:var(--warn-dim);border-color:rgba(255,193,69,.35)}
.tip .grow{flex:1;min-width:150px}
.excard .foot{display:flex;gap:8px;margin-top:12px}
.excard .foot .btn{flex:1;min-height:38px;font-size:var(--text-xs);padding:6px 10px;color:var(--muted)}
.finish{width:100%;min-height:58px;padding:16px;border-radius:var(--r-lg);background:var(--lime);color:var(--on-lime);font-family:var(--font-display);font-size:var(--text-lg);font-weight:600;margin-top:16px;box-shadow:0 8px 24px rgba(198,245,39,.18)}
.finish:active{transform:scale(.98)}
.finish:disabled{opacity:.35;box-shadow:none}

/* ---------- Plan bearbeiten ---------- */
.planrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:8px}
.planrow .nm{flex:1;min-width:0}
.planrow .nm b{display:block;font-size:var(--text-sm);overflow-wrap:anywhere}
.planrow .nm span{display:block;font-size:var(--text-xs);color:var(--muted);margin-top:2px}
.planrow .w{font-family:var(--font-display);color:var(--lime);font-weight:600;white-space:nowrap;text-align:right;font-size:var(--text-base)}
.planrow .w small{display:block;font-family:var(--font-body);font-size:var(--text-xs);color:var(--muted);font-weight:500}
.planday{display:flex;align-items:center;gap:10px;padding:18px 2px 10px}
.planday h3{flex:1;font-size:var(--text-lg);min-width:0}
.planday h3 small{display:block;font-family:var(--font-body);font-size:var(--text-xs);color:var(--muted);font-weight:500;margin-top:3px}

/* ---------- Kalender ---------- */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calhead h3{flex:1;text-align:center;font-size:var(--text-lg)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calgrid .wd{text-align:center;font-size:var(--text-xs);color:var(--faint);font-weight:700;padding-bottom:2px}
.cday{aspect-ratio:1/1;min-height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--divider);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:var(--text-sm);color:var(--muted);position:relative;padding:0}
.cday.planned{border-color:var(--lime-line);color:var(--text)}
.cday.done{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.cday.skipped{color:var(--faint);text-decoration:line-through;border-style:dashed}
.cday.missed{border-color:rgba(255,107,94,.45);color:var(--danger)}
.cday.today{box-shadow:0 0 0 2px var(--text) inset}
.cday small{font-size:9px;font-weight:600;letter-spacing:.3px;opacity:.85;margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:var(--text-xs);color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--border)}

/* ---------- Statistik ---------- */
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (min-width:760px){ .statgrid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;min-width:0}
.stat b{font-family:var(--font-display);font-size:26px;color:var(--lime);display:block;line-height:1.15;white-space:nowrap}
.stat span{font-size:var(--text-xs);color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-body)}
.prog{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--divider)}
.prog:last-child{border-bottom:0}
.prog .nm{flex:1;min-width:0;font-size:var(--text-sm)}
.prog .nm span{display:block;font-size:var(--text-xs);color:var(--muted)}
.prog .up{font-family:var(--font-display);font-weight:600;color:var(--lime);white-space:nowrap}
.prog .up.zero{color:var(--faint)}
.logitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 12px 12px 14px;margin-bottom:8px}
.logitem .ico{flex:none;width:38px;height:38px;border-radius:11px;background:var(--lime-dim);color:var(--lime);display:grid;place-items:center}
.logitem .txt{flex:1;min-width:0;text-align:left}
.logitem .txt b{display:block;font-size:var(--text-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logitem .txt span{display:block;font-size:var(--text-xs);color:var(--muted)}

/* ---------- Profil ---------- */
.pcard{display:flex;align-items:center;gap:14px}
.pcard .av{width:54px;height:54px;border-radius:50%;background:var(--lime);color:var(--on-lime);font-family:var(--font-display);font-size:24px;font-weight:600;display:grid;place-items:center;flex:none}
.metric{background:var(--offset);border:1px solid var(--divider);border-radius:var(--r-md);padding:12px 14px;min-width:0}
.metric b{display:block;font-family:var(--font-display);font-size:22px;color:var(--text);line-height:1.2;white-space:nowrap}
.metric span{font-size:var(--text-xs);color:var(--muted)}
.metric em{display:block;font-style:normal;font-size:var(--text-xs);margin-top:2px}
.scale{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,#7DB7FF 0 18%,var(--lime) 18% 50%,var(--warn) 50% 75%,var(--danger) 75%);margin:12px 0 4px}
.scale i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--bg)}
.whist{display:flex;flex-direction:column}
.whist > div{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--divider);font-size:var(--text-sm)}
.whist > div span{flex:1;color:var(--muted)}

/* ---------- Unterseiten (Bottom Sheet) ---------- */
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fadebg .2s ease}
@keyframes fadebg{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-bottom:0;border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (min-width:760px){ .sheet-bg{align-items:center} .sheet{border-radius:22px;border-bottom:1px solid var(--border);max-height:86dvh} }
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 12px}
.sheet h2{font-size:var(--text-lg);margin-bottom:4px}
.sheet .sub{font-size:var(--text-sm);color:var(--muted);margin-bottom:14px}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts .btn{flex:1}
.search{position:sticky;top:-10px;background:var(--surface);padding:6px 0 10px;z-index:2}

/* ---------- Einrichtung ---------- */
.onb{max-width:520px;margin:0 auto;padding:max(28px,env(safe-area-inset-top,0px)) 18px 40px}
.onb .steps{display:flex;gap:6px;margin-bottom:22px}
.onb .steps i{flex:1;height:4px;border-radius:9px;background:var(--surface-2)}
.onb .steps i.on{background:var(--lime)}
.onb h1{font-size:28px;margin-bottom:6px}
.onb .lead{color:var(--muted);margin-bottom:20px}
.onb .navbtns{display:flex;gap:10px;margin-top:24px}
.onb .navbtns .btn{flex:1}
body.onboarding{padding-bottom:0}
body.onboarding header, body.onboarding nav{display:none}

/* ---------- Navigation unten ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(11,12,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--divider)}
.nav-in{max-width:var(--maxw);margin:0 auto;height:var(--nav-h);display:flex;padding:0 max(4px,env(safe-area-inset-right,0px)) 0 max(4px,env(safe-area-inset-left,0px))}
.nav-in button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);font-size:11px;font-weight:600}
.nav-in button.on{color:var(--lime)}
.nav-in svg{width:22px;height:22px}

/* ---------- Pause-Timer, Toast ---------- */
#timer{position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--surface-2);border:1px solid var(--lime-line);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transform:translate(-50%,160%);transition:transform .25s cubic-bezier(.16,1,.3,1);visibility:hidden}
#timer.show{transform:translate(-50%,0);visibility:visible}
#timer .t{font-family:var(--font-display);font-size:var(--text-lg);color:var(--lime);min-width:54px;font-variant-numeric:tabular-nums}
#timer .lb{font-size:var(--text-sm);color:var(--muted)}
#timer button{white-space:nowrap;border-radius:999px;padding:8px 14px;font-weight:700;font-size:var(--text-sm);background:var(--surface);border:1px solid var(--border)}
#timer button.lime{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));z-index:80;transform:translate(-50%,-220%);background:var(--text);color:var(--bg);border-radius:var(--r-md);padding:10px 10px 10px 18px;font-weight:700;font-size:var(--text-sm);box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);visibility:hidden}
#toast.show{transform:translate(-50%,0);visibility:visible}
#toast button{background:var(--bg);color:var(--lime);border-radius:9px;padding:6px 12px;font-weight:700}
#toast span{padding:4px 8px 4px 0}

</style>
