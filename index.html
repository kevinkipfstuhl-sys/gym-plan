<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gym Plan</title>
<meta name="description" content="Flexible Trainings-App: Workouts, eigene Module, Live-Logging – komplett offline.">
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <div class="head-in">
    <img class="logo" src="icon-192.png" alt="">
    <div class="head-txt">
      <h1>Gym Plan</h1>
      <p id="headSub">Training nach Lust und Laune</p>
    </div>
    <div class="streak"><b id="streakN" class="num">0</b><span>Sessions</span></div>
  </div>
</header>

<main id="app"></main>

<div id="timer" role="status" aria-live="polite">
  <span class="t" id="timerT">1:30</span>
  <span class="lb">Pause</span>
  <button data-timer="-15" aria-label="15 Sekunden weniger">−15</button>
  <button data-timer="15" aria-label="15 Sekunden mehr">+15</button>
  <button data-timer="skip" class="go">Weiter</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet-root"></div>

<nav>
  <div class="nav-in">
    <button data-nav="start">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M4 9v6M20 9v6M6.5 12h11"/></svg>
      Training
    </button>
    <button data-nav="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16.5 5.5l3.5 1-3.5 13-3.5-1z"/></svg>
      Bibliothek
    </button>
    <button data-nav="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Verlauf
    </button>
    <button data-nav="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      Profil
    </button>
  </div>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
